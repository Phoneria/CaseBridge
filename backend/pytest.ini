[pytest]
testpaths = tests
python_files = test_*.py
markers =
    real_openai: requires a live OpenAI API key and network access; excluded by default
    real_qwen: requires a live Qwen (Alibaba Model Studio) API key and network access; excluded by default
addopts = -ra --strict-markers
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
