name: Bounded gallery CI approval
on:
  workflow_dispatch:
    inputs:
      pr:
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
  actions: write
jobs:
  approve:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Request actual CI for exact own bounded gallery PR
        env:
          GH_TOKEN: ${{ github.token }}
          GALLERY_PR: ${{ inputs.pr }}
        run: python3 scripts/approve-gallery-ci.py "$GALLERY_PR"
