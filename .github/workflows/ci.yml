name: CI

on:
  workflow_dispatch:
    inputs:
      base:
        required: true
        type: string
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  spec-governance:
    outputs:
      ui_scope: ${{ steps.scope.outputs.value }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bind dispatched acceptance to actual protected-main ancestry
        if: github.event_name == 'workflow_dispatch'
        env:
          BASE: ${{ github.event.inputs.base }}
        run: |
          test "$BASE" = "$(git merge-base origin/main "$GITHUB_SHA")"
      - name: Classify fast UI checks using the base policy
        id: scope
        env:
          BASE: ${{ github.event.inputs.base || github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          scope=standard
          if git show "$BASE:deployment/auto-ui.py" > "$RUNNER_TEMP/auto-ui.py"; then
            scope=$(python3 -I "$RUNNER_TEMP/auto-ui.py" classify "$(git merge-base "$BASE" "$HEAD")" "$HEAD")
          fi
          echo "value=$scope" >> "$GITHUB_OUTPUT"
      - name: Validate PR behavior-to-acceptance links
        id: acceptance
        env:
          SPEC_BASE: ${{ github.event.inputs.base || github.event.pull_request.base.sha || github.event.before }}
          SPEC_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/check-spec-changes.py --base "$SPEC_BASE" --head "$SPEC_HEAD" --plan-output /tmp/spec-acceptance.json
      - uses: actions/setup-python@v5
        if: steps.acceptance.outputs.pytest == 'true'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install bound backend acceptance dependencies
        if: steps.acceptance.outputs.pytest == 'true'
        run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        if: steps.acceptance.outputs.vitest == 'true'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install bound frontend acceptance dependencies
        if: steps.acceptance.outputs.vitest == 'true'
        run: npm ci --prefix frontend
      - name: Run bound acceptance tests
        env:
          SPEC_BASE: ${{ github.event.inputs.base || github.event.pull_request.base.sha || github.event.before }}
          SPEC_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/check-spec-changes.py --base "$SPEC_BASE" --head "$SPEC_HEAD" --run
      - name: Validate Spec Kit contracts and task traceability
        run: python3 scripts/check-specs.py
      - name: Verify immutable release boundaries and recovery
        run: python3 -m unittest discover -s deployment/tests -v
      - name: Validate production Compose using synthetic configuration
        run: python3 scripts/check-compose.py

  backend:
    needs: spec-governance
    if: contains(fromJSON('["standard","none"]'), needs.spec-governance.outputs.ui_scope)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations against a throwaway SQLite DB
        env:
          DATABASE_URL: "sqlite:///./ci_test.db"
          JWT_SECRET: "ci-test-secret"
        run: alembic upgrade head

      - name: Run backend test suite
        env:
          JWT_SECRET: "ci-test-secret"
          ENV: "test"
          LLM_PROVIDER: "mock"
        run: pytest -q

  frontend:
    needs: spec-governance
    if: contains(fromJSON('["standard","none"]'), needs.spec-governance.outputs.ui_scope) || needs.spec-governance.outputs.ui_scope == 'app' || needs.spec-governance.outputs.ui_scope == 'all'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run component tests
        if: contains(fromJSON('["standard","none"]'), needs.spec-governance.outputs.ui_scope)
        run: npm run test

      - name: Verify committed application version
        run: node scripts/update-version.mjs --check

      - name: Production build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
        run: npm run build
