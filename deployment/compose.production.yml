# CaseBridge production stack on the shared Hetzner server (ubuntu-8gb-fsn1-1),
# next to the Autosense stack in /opt/autosense-b2c.
#
# HTTPS is NOT handled here: Autosense's Caddy (container autosense-b2c-web-1) already
# owns ports 80/443. Its Caddyfile (/opt/autosense-b2c/deploy/Caddyfile) gets the block in
# deployment/Caddyfile.app-block, which proxies app.casebridge.com.tr to cb-frontend / cb-backend.
# For that, cb-frontend and cb-backend also join Autosense's Docker network.
#
# Service names start with "cb-" ON PURPOSE: Autosense's Caddy resolves "backend" on that
# network, so a CaseBridge service called "backend" there would steal Autosense's API traffic.
#
# Run ONLY with:
#   sudo docker compose --env-file /etc/casebridge/production.env -f deployment/compose.production.yml <command>
# Never use the root docker-compose.yml on the server: it seeds demo accounts and publishes 3000/8000/5432.
name: cb-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  cb-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: casebridge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in /etc/casebridge/production.env}
      POSTGRES_DB: casebridge
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casebridge -d casebridge"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *default-logging

  cb-backend:
    build:
      context: ../backend
    restart: unless-stopped
    # Migrations, then ONE Uvicorn process: the simulation, courtroom and reminder
    # workers run inside it, so never add --workers or scale this service.
    # No seed here: the demo seed creates accounts with a known password.
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"]
    env_file:
      - /etc/casebridge/production.env
    environment:
      DATABASE_URL: postgresql://casebridge:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in /etc/casebridge/production.env}@cb-db:5432/casebridge
      STORAGE_DIR: /app/storage
      ENV: production
      SEED_DEMO_DATA: "false"
    volumes:
      - storage:/app/storage
    networks:
      - internal
      - edge
    depends_on:
      cb-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    logging: *default-logging

  cb-frontend:
    build:
      context: ../frontend
      args:
        # Inlined into the browser bundle at build time: change it -> rebuild the frontend.
        NEXT_PUBLIC_API_URL: https://app.casebridge.com.tr/api
    restart: unless-stopped
    networks:
      - edge
    depends_on:
      cb-backend:
        condition: service_healthy
    logging: *default-logging

networks:
  # CaseBridge only: the database is reachable from cb-backend alone.
  internal: {}
  # Autosense's network, where its Caddy runs. Created by the Autosense stack, not by us.
  edge:
    name: autosense-b2c_default
    external: true

volumes:
  pgdata:
  storage:
